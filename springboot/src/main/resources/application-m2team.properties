# Explicit team target only. Missing variables must fail instead of using the demo database.
# Secrets are supplied to the backend process; never commit real values here.
spring.datasource.url=${M2_TEAM_DB_URL}
spring.datasource.username=${M2_TEAM_DB_USER}
spring.datasource.password=${M2_TEAM_DB_PASSWORD}

# Local developer access to the team database; not a public server deployment profile.
server.address=127.0.0.1
spring.devtools.restart.enabled=false
spring.sql.init.mode=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
