# 答辩链路-后端端口：Vite 代理会把 /api 请求转发到这个 9090 端口；下一步进入对应 Controller，例如 StudentController。
server.port=9090
# MySQL 8.0
# 答辩链路-数据库连接：后端通过 JDBC 连接本机 MySQL 的 dormitory 数据库；下一步看 Entity/Mapper/Service 如何操作具体表。
spring.datasource.url=jdbc:mysql://localhost:3306/dormitory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#访问静态资源
server.resources.static-locations=classpath:/resources/,classpath:/static/
spring.thymeleaf.prefix=classpath:/static
